name: PR171 review fixes

on:
  push:
    branches:
      - codex/research-source-quality-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-source-quality-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 5 --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --disable-pip-version-check --timeout 30 --retries 5

      - name: Apply bounded review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, block: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  return
              p.write_text(text.rstrip() + "\n\n\n" + block.strip() + "\n", encoding="utf-8")

          # P2-1: official/server-rendered publication must settle the durable turn
          # if the absolute research deadline already expired.
          replace_once(
              "src/application/chat_service.py",
              '''        if answer_validation_active(prepared) and prepared.answer_validation is None:\n            remaining_seconds(prepared.research_deadline)\n            return self.complete_turn(prepared, "").assistant_message\n''',
              '''        if answer_validation_active(prepared) and prepared.answer_validation is None:\n            try:\n                remaining_seconds(prepared.research_deadline)\n            except TimeoutError:\n                self.fail_turn(prepared)\n                raise\n            return self.complete_turn(prepared, "").assistant_message\n''',
          )

          # P2-2: stage/persist answer egress only at the physical generation-start
          # linearization point. Server-rendered publication never reaches this seam.
          replace_once(
              "src/application/policy_chat_service.py",
              '''        self._check_research_model_budget(prepared, next_calls)\n        route_snapshot = {\n''',
              '''        self._check_research_model_budget(prepared, next_calls)\n        self._record_answer_call(prepared, "attempted")\n        route_snapshot = {\n''',
          )
          replace_once(
              "src/application/policy_chat_service.py",
              '''    def generate(self, prepared: PreparedChatTurn) -> str:\n        self._record_answer_call(prepared, "attempted")\n        return super().generate(prepared)\n\n    def stream(self, prepared: PreparedChatTurn, *, should_cancel=None) -> Iterator[str]:\n        def audited_stream() -> Iterator[str]:\n            self._record_answer_call(prepared, "attempted")\n            yield from super(ExternalDataPolicyChatService, self).stream(\n                prepared, should_cancel=should_cancel\n            )\n\n        return audited_stream()\n\n    async def stream_async(self, prepared: PreparedChatTurn) -> AsyncIterator[str]:\n        self._record_answer_call(prepared, "attempted")\n        async for token in super().stream_async(prepared):\n            yield token\n''',
              '''    def generate(self, prepared: PreparedChatTurn) -> str:\n        return super().generate(prepared)\n\n    def stream(self, prepared: PreparedChatTurn, *, should_cancel=None) -> Iterator[str]:\n        return super().stream(prepared, should_cancel=should_cancel)\n\n    async def stream_async(self, prepared: PreparedChatTurn) -> AsyncIterator[str]:\n        async for token in super().stream_async(prepared):\n            yield token\n''',
          )

          # P2-3: carry best-effort author metadata through structured fetch/cache.
          replace_once(
              "src/news/article_fetcher.py",
              '''    content_type: str = ""\n    reason: str = ""\n''',
              '''    content_type: str = ""\n    reason: str = ""\n    author: str = ""\n''',
          )
          replace_once(
              "src/news/article_fetcher.py",
              '''_ARTICLE_CACHE: dict[str, tuple[float, str, str]] = {}\n''',
              '''_ARTICLE_CACHE: dict[str, tuple[float, str, str, str]] = {}\n''',
          )
          replace_once(
              "src/news/article_fetcher.py",
              '''            method=cached[2],\n            requested_url=url,\n''',
              '''            method=cached[2],\n            author=cached[3],\n            requested_url=url,\n''',
          )
          p = Path("src/news/article_fetcher.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace('_ARTICLE_CACHE[url] = (now, "", "")', '_ARTICLE_CACHE[url] = (now, "", "", "")')
          text = text.replace('_ARTICLE_CACHE[url] = (now, text, method)', '_ARTICLE_CACHE[url] = (now, text, method, "")')
          old_local = '''                _ARTICLE_CACHE[url] = (now, local_result.text, local_result.method)\n                return ArticleReadResult(\n                    ok=True,\n                    text=local_result.text,\n                    method=local_result.method,\n                    requested_url=url,\n'''
          new_local = '''                _ARTICLE_CACHE[url] = (\n                    now, local_result.text, local_result.method, local_result.author\n                )\n                return ArticleReadResult(\n                    ok=True,\n                    text=local_result.text,\n                    method=local_result.method,\n                    author=local_result.author,\n                    requested_url=url,\n'''
          if text.count(old_local) != 1:
              raise SystemExit("article_fetcher.py: local author propagation anchor mismatch")
          text = text.replace(old_local, new_local, 1)
          old_apply = '''    item["article_url"] = result.requested_url\n    item["article_content_type"] = result.content_type\n'''
          new_apply = '''    item["article_url"] = result.requested_url\n    item["article_content_type"] = result.content_type\n    item["article_author"] = result.author\n'''
          if text.count(old_apply) != 1:
              raise SystemExit("article_fetcher.py: enrichment author anchor mismatch")
          text = text.replace(old_apply, new_apply, 1)
          p.write_text(text, encoding="utf-8")

          replace_once(
              "src/web/tool_gateway.py",
              '''        return {\n            "ok": True,\n            "kind": "web_page",\n            "url": result.final_url or result.requested_url,\n            "method": result.method,\n            "content": result.text,\n        }\n''',
              '''        response = {\n            "ok": True,\n            "kind": "web_page",\n            "url": result.final_url or result.requested_url,\n            "method": result.method,\n            "content": result.text,\n        }\n        if result.author:\n            response["author"] = result.author\n        return response\n''',
          )

          append_once(
              "tests/test_research_finalization_deadline.py",
              "test_expired_official_publication_deadline_settles_turn",
              '''def test_expired_official_publication_deadline_settles_turn(tmp_path):\n    from src.application.chat_service import answer_validation_active\n\n    service, repository = _service(tmp_path)\n    prepared = service.start_turn(\n        ChatCommand(user_input="official release", thread_id="deadline-official")\n    )\n    prepared = replace(\n        prepared,\n        research_deadline=time.monotonic() - 1,\n        route={\n            **prepared.route,\n            "task_contract": {"task_intent": "research"},\n        },\n        rag={\n            **prepared.rag,\n            "web_tools": {"enabled": True, "calls": []},\n        },\n    )\n    assert answer_validation_active(prepared)\n\n    with pytest.raises(TimeoutError):\n        service.generate(prepared)\n\n    restored = repository.get_chat_turn(prepared.turn.id)\n    assert restored is not None\n    assert restored.status == "failed"\n    thread = repository.get_chat_thread(prepared.thread.id)\n    assert thread is not None\n    assert thread.active_operation_id is None\n    assert not restored.assistant_message\n    assert prepared.route.get("answer_generation_calls", 0) == 0\n''',
          )

          append_once(
              "tests/test_external_data_policy.py",
              "test_server_rendered_publication_does_not_invent_answer_egress",
              '''def test_server_rendered_publication_does_not_invent_answer_egress(tmp_path):\n    service, _captured = _service(tmp_path)\n    prepared = service.start_turn(\n        PolicyChatCommand(\n            user_input="FastAPI当前最新版本及发布日期",\n            thread_id="chat-server-rendered-publication",\n            task_intent="research",\n            web_policy="auto",\n            cloud_context_policy="allow_local_evidence",\n        )\n    )\n\n    service.generate(prepared)\n\n    execution = prepared.rag["external_data_policy"]\n    assert prepared.route.get("answer_generation_calls", 0) == 0\n    assert not any(\n        call.get("purpose") == "answer_generation"\n        for call in execution["external_calls"]\n    )\n    assert execution["history_sent_to_model"] is False\n    assert execution["learning_state_sent_to_model"] is False\n    assert execution["memory_context_sent_to_model"] is False\n    assert execution["local_evidence_sent_to_model"] is False\n\n    stored = service.repository.get_chat_turn(prepared.turn.id)\n    assert stored is not None\n    stored_execution = stored.rag_snapshot["external_data_policy"]\n    assert not any(\n        call.get("purpose") == "answer_generation"\n        for call in stored_execution["external_calls"]\n    )\n''',
          )

          append_once(
              "tests/test_news_reader_transport.py",
              "test_author_propagates_through_fetch_cache_and_gateway",
              '''def test_author_propagates_through_fetch_cache_and_gateway(monkeypatch):\n    from src.news import article_fetcher\n    from src.news.readers.base import ReaderResult\n    from src.web.tool_gateway import GeneralWebGateway\n\n    article_fetcher._ARTICLE_CACHE.clear()\n    monkeypatch.setattr(\n        article_fetcher,\n        "_is_fetchable_article_url",\n        lambda _url: True,\n    )\n    monkeypatch.setattr(\n        article_fetcher,\n        "_fetch_html_payload",\n        lambda _url, timeout, max_bytes: (\n            '<meta name="author" content="Grace Hopper">',\n            "https://example.com/post",\n            "text/html",\n            "",\n        ),\n    )\n    monkeypatch.setattr(\n        article_fetcher,\n        "read_html_locally",\n        lambda html, url="", max_chars=5000: ReaderResult(\n            text="article body " * 20,\n            method="trafilatura",\n            author="Grace Hopper",\n        ),\n    )\n\n    first = article_fetcher.fetch_article_read_result("https://example.com/post")\n    second = article_fetcher.fetch_article_read_result("https://example.com/post")\n    gateway = GeneralWebGateway().read("https://example.com/post")\n\n    assert first.author == "Grace Hopper"\n    assert second.author == "Grace Hopper"\n    assert gateway["author"] == "Grace Hopper"\n''',
          )
          PY

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_research_finalization_deadline.py \
            tests/test_external_data_policy.py \
            tests/test_news_reader_transport.py \
            tests/test_official_source_quality.py
          ruff check \
            src/application/chat_service.py \
            src/application/policy_chat_service.py \
            src/news/article_fetcher.py \
            src/web/tool_gateway.py \
            tests/test_research_finalization_deadline.py \
            tests/test_external_data_policy.py \
            tests/test_news_reader_transport.py \
            tests/test_official_source_quality.py
          git diff --check

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr171-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR 171 review findings"
          git push origin HEAD:codex/research-source-quality-v2
