name: RQ1-C Secret Allowlist Fix

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'rq1c-secret-allowlist' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add two checksum line allowlists
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/rq1c-live-qualification.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          keys = ('LLAMA_CPP_ARCHIVE_SHA256:', 'PLANNER_MODEL_SHA256_EXPECTED:')
          changed = 0
          for index, line in enumerate(lines):
              stripped = line.strip()
              if any(stripped.startswith(key) for key in keys):
                  if '# pragma: allowlist secret' in line:
                      continue
                  lines[index] = line + '  # pragma: allowlist secret'
                  changed += 1
          if changed != 2:
              raise SystemExit(f'expected exactly two checksum allowlists, changed={changed}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Verify exact detect-secrets gate
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt --disable-pip-version-check --timeout 30 --retries 5
          detect-secrets scan --disable-plugin KeywordDetector \
            --exclude-files '.*\.(pyc|jpg|png|zip)$' \
            --exclude-lines '(base_sha|head_sha|commit_sha|file_sha|tree_sha|ref|source_artifact_head)[^A-Za-z0-9]+[0-9a-f]{40}|(fingerprint_sha256|observation_sha256|input_sha256|response_sha256|content_sha256)[^A-Za-z0-9]+[0-9a-f]{64}|id[^A-Za-z0-9]+MDIzOlB1bGxSZXF1ZXN0UmV2aWV3VGhyZWFk[A-Za-z0-9+/=]+' \
            .github README.md docs src tests tools config templates roles changelog assets frontend .env.example \
            > detect-secrets-report.json
          python - <<'PY'
          import json
          with open('detect-secrets-report.json', encoding='utf-8') as handle:
              report = json.load(handle)
          findings = {name: rows for name, rows in report.get('results', {}).items() if rows}
          if findings:
              raise SystemExit(f'detect-secrets still has findings: {findings}')
          PY
      - name: Commit validated two-line fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rq1c-secret-allowlist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rq1c-live-qualification.yml .github/workflows/rq1c-secret-allowlist.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "ci(rq1c): allowlist pinned public checksums"
          git push origin HEAD:codex/rq1c-bounded-qualification
