name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # Needed to resolve the trusted batch start (the head of the last successful run of this
  # workflow on main). Without it the lookup is denied, and a silently empty answer would
  # drop the batch back to the single-slice range this change exists to remove.
  actions: read

# Feature-branch pushes used to trigger both a push run and a PR run of the same
# workflow at the same head. Only pull_request (plus main pushes and manual runs)
# triggers now, and superseded runs on the same ref are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin the supported runner image for Playwright's Chromium/Firefox/WebKit system deps.
    # ubuntu-latest moved to 26.04; the 2026-10-25 CI run stalled while apt fetched
    # 185 packages from that image and timed out before any browser test started.
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          # The classify step diffs the main-push range; a shallow clone would not have
          # the before commit, which would silently fall back to the full scope.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Classify pull request scope
        id: ci_scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Routing lives in tools/ci_scope.py (one source of truth, unit tested). The
          # workflow must not re-derive it with its own path matching.
          changed_file_list="${RUNNER_TEMP}/ci-changed-files.txt"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if ! gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename' > "$changed_file_list" || [ ! -s "$changed_file_list" ]; then
              echo "::warning::Could not classify PR paths; widening to the full scope."
              changed_file_list=""
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # A single merge push only diffs against its immediate parent, so a batch of
            # merges becomes N runs. The concurrency group cancels the first N-1, which
            # leaves one run that sees "files: 1" and is still read as the batch verdict.
            #
            # Resolve a trusted batch start instead: the head of the last successful run
            # of this workflow on main. tools/ci_batch_range.py proves that start is a real
            # ancestor of the pushed commit and refuses to use anything it cannot prove;
            # an unprovable batch widens to the full scope rather than quietly classifying
            # only the last slice.
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=""
            fi

            batch_candidate=""
            if batch_candidate="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha' 2>/dev/null)"; then
              batch_lookup="ok"
            else
              # A denied or failed lookup is not the same as "there is no earlier run".
              # Treating them alike would quietly drop the batch back to the single-slice
              # range, which is the defect this exists to remove.
              batch_lookup="failed"
              batch_candidate=""
            fi

            if [ "$batch_lookup" = "failed" ]; then
              echo "::warning::Batch baseline lookup failed; widening to the full scope."
              changed_file_list=""
            else
              batch_outcome="$(python tools/ci_batch_range.py \
                --candidate "$batch_candidate" \
                --head "${GITHUB_SHA}" \
                --fallback "$before" 2>&1 || true)"
              echo "$batch_outcome"
              batch_mode="$(printf '%s\n' "$batch_outcome" | sed -n 's/^batch_mode=//p')"
              batch_from="$(printf '%s\n' "$batch_outcome" | sed -n 's/^batch_from=//p')"
              echo "batch_lookup=${batch_lookup}" >> "$GITHUB_OUTPUT"
              echo "batch_mode=${batch_mode}" >> "$GITHUB_OUTPUT"
              echo "batch_from=${batch_from}" >> "$GITHUB_OUTPUT"

              if [ "$batch_mode" = "widen" ] || [ -z "$batch_from" ]; then
                echo "::warning::No provable batch range; widening to the full scope."
                changed_file_list=""
              else
                git diff --name-only "$batch_from" "${GITHUB_SHA}" > "$changed_file_list" \
                  || changed_file_list=""
              fi
            fi
          fi

          if [ -z "$changed_file_list" ] || [ ! -s "$changed_file_list" ]; then
            echo "::warning::No usable path list; widening to the full scope."
            echo "scope=full-fallback" >> "$GITHUB_OUTPUT"
            echo "impact_set=" >> "$GITHUB_OUTPUT"
            echo "frontend_required=true" >> "$GITHUB_OUTPUT"
            echo "frontend_e2e_required=true" >> "$GITHUB_OUTPUT"
            echo "frontend_e2e_specs=" >> "$GITHUB_OUTPUT"
            echo "research_browser_required=true" >> "$GITHUB_OUTPUT"
            echo "browser_required=true" >> "$GITHUB_OUTPUT"
            echo "qualification_required=true" >> "$GITHUB_OUTPUT"
            echo "l3_eligible=true" >> "$GITHUB_OUTPUT"
            echo "full_scope=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python tools/ci_scope.py --paths-file "$changed_file_list" >> "$GITHUB_OUTPUT"
          echo "CI scope: $(grep '^scope=' "$GITHUB_OUTPUT" | tail -n 1), files: $(wc -l < "$changed_file_list")"

      - name: Enforce product iteration policy discoverability
        id: product_policy
        continue-on-error: true
        run: python tools/check_product_iteration_policy.py

      - name: Report L3 eligibility (never starts L3)
        shell: bash
        run: |
          # Eligibility is a report. Starting L3 is ci-l3.yml's job, on an explicit
          # trigger, so a shared-core push cannot silently launch a full run.
          echo "L3_ELIGIBLE=${{ steps.ci_scope.outputs.l3_eligible }}"
          echo "L3_REQUIRED_FOR_MERGE=${{ steps.ci_scope.outputs.l3_required_for_merge }}"


      - uses: actions/setup-node@v4
        # The Node toolchain serves the frontend gates and the E2E gates. ci_scope treats
        # them as separate cost tiers, so the toolchain is prepared when either is
        # required, without merging the classifications.
        if: >-
          steps.ci_scope.outputs.frontend_required == 'true' ||
          steps.ci_scope.outputs.frontend_e2e_required == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 5 --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt --disable-pip-version-check --timeout 30 --retries 5

      - name: Run bounded impact set (fast tier)
        id: pytest_impact
        if: >-
          steps.ci_scope.outputs.full_scope != 'true' &&
          steps.ci_scope.outputs.impact_set != ''
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          # The fast tier runs the named impact set from tests/stage_gates.json, not a
          # list of files kept in this workflow and not the full suite.
          python tools/run_stage_gate.py \
            --impact-set "${{ steps.ci_scope.outputs.impact_set }}" 2>&1 | tee pytest.log

      - name: Run pytest
        id: pytest
        if: >-
          steps.ci_scope.outputs.full_scope == 'true' ||
          steps.ci_scope.outputs.impact_set == ''
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          pytest -q --tb=short --durations=30 2>&1 | tee pytest.log

      - name: Run RAG K1 local quality baseline
        id: rag_quality
        continue-on-error: true
        run: |
          python tools/run_rag_quality_baseline.py \
            --output rag-quality-baseline.json \
            > rag-quality-baseline.log 2>&1

      - name: Run ruff
        id: ruff
        continue-on-error: true
        run: ruff check .

      - name: Run package helper (validate packaging logic)
        id: packaging
        continue-on-error: true
        run: python tools/package_project_helper.py . "${RUNNER_TEMP}/study-agent-ci-package.zip" 0

      - name: Run detect-secrets
        id: secrets
        continue-on-error: true
        run: |
          # docs/research_quality/*.json are machine-generated evidence artifacts whose
          # content is dominated by hashes/ids (query_sha256, git_sha, candidate ids...),
          # so the entropy detectors only ever produce false positives there. They are
          # still scanned for key-like patterns by tools/package_project_helper.py.
          # tests/fixtures/release_benchmark/*.json hold the same kind of frozen
          # digests (source_text_sha256, content_sha256), so their hash-bearing
          # keys are excluded by name below rather than by widening the scan.
          # docs/evidence/real-acceptance-2026/scenarios.json pins the commit its
          # frozen run targeted ("candidate_head"); the value was verified to be a
          # real commit object in this repository before it was named here.
          detect-secrets scan --disable-plugin KeywordDetector \
            --exclude-files '.*\.(pyc|jpg|png|zip)$|docs[\\/]research_quality[\\/].*\.json$' \
            --exclude-lines '(base_sha|head_sha|candidate_head|commit_sha|file_sha|tree_sha|ref|source_artifact_head)[^A-Za-z0-9]+[0-9a-f]{40}|(fingerprint_sha256|observation_sha256|input_sha256|response_sha256|content_sha256|candidate_sha256|source_text_sha256|plan_digest|registry_digest|"sha256")[^A-Za-z0-9]+[0-9a-f]{64}|id[^A-Za-z0-9]+MDIzOlB1bGxSZXF1ZXN0UmV2aWV3VGhyZWFk[A-Za-z0-9+/=]+' \
            .github README.md docs src tests tools config templates roles changelog assets frontend .env.example \
            > detect-secrets-report.json 2>&1
          python tools/filter_verified_evidence_hashes.py --report detect-secrets-report.json
          python - <<'PY'
          import json
          import sys

          with open("detect-secrets-report.json", encoding="utf-8") as f:
              report = json.load(f)

          findings = {
              filename: secrets
              for filename, secrets in report.get("results", {}).items()
              if secrets
          }
          if findings:
              print("ERROR: potential secrets detected — this is a public repository")
              print("If these are false positives, add an inline allowlist comment or update the scan exclusions.")
              json.dump(findings, sys.stdout, indent=2, sort_keys=True)
              print()
              sys.exit(1)
          PY
          echo "detect-secrets: no secrets found"

      - name: Run expanded mypy
        id: mypy
        continue-on-error: true
        run: timeout 120s mypy --explicit-package-bases src/ > mypy.log 2>&1

      - name: Enforce mypy baseline
        id: mypy_baseline
        continue-on-error: true
        env:
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
        run: |
          python tools/check_mypy_baseline.py \
            --log mypy.log \
            --baseline config/mypy_baseline.json \
            --outcome "$MYPY_OUTCOME"

      - name: Install frontend dependencies
        id: node_deps
        # npm ci runs whenever the Node toolchain is needed - the frontend gates or the
        # E2E gates. The two tiers are separate outputs and the OR is kept as defence in
        # depth: a browser step must never launch against a missing node_modules, which
        # fails with exit 127 rather than a useful error.
        if: >-
          steps.ci_scope.outputs.frontend_required == 'true' ||
          steps.ci_scope.outputs.frontend_e2e_required == 'true'
        continue-on-error: true
        timeout-minutes: 8
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci > ../frontend-deps.log 2>&1

      - name: Test and build frontend
        id: frontend
        continue-on-error: true
        working-directory: frontend
        env:
          FRONTEND_REQUIRED: ${{ steps.ci_scope.outputs.frontend_required }}
        run: |
          set -o pipefail
          if [ "$FRONTEND_REQUIRED" != "true" ]; then
            echo "Skipped: PR contains only frontend-independent research/backend paths." > ../frontend.log
            exit 0
          fi
          {
            npm test
            npm run build
          } > ../frontend.log 2>&1

      - name: Install Playwright browsers
        if: steps.ci_scope.outputs.frontend_e2e_required == 'true' && steps.node_deps.outcome == 'success'
        id: playwright_install
        continue-on-error: true
        # The apt mirror behind the hosted runner is intermittently slow: run
        # 40287246070 spent the whole 20-minute ceiling fetching 126 of ~185
        # packages at 50-300 KB/s, so the step was killed before any browser test
        # started. Give it headroom and let apt retry a stalled package.
        timeout-minutes: 40
        working-directory: frontend
        run: |
          set -o pipefail
          # Keep install progress visible in the Actions job as well as diagnostics.
          # `set -o pipefail` still fails the step when the installer fails.
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-playwright-retries
          npx playwright install --with-deps chromium firefox webkit 2>&1 | tee ../playwright-install.log

      # A failing browser gate must be diagnosable from the job log. The full
      # output still goes to the ci-diagnostics artifact, but redirecting it all
      # to a file left the job with a bare "exit code 1" and forced a 30 MB
      # artifact download just to learn which assertion failed.
      - name: Run browser Golden Journeys
        if: steps.ci_scope.outputs.frontend_e2e_required == 'true' && steps.playwright_install.outcome == 'success'
        id: browser_e2e
        continue-on-error: true
        timeout-minutes: 12
        working-directory: frontend
        run: |
          set -o pipefail
          # `if !` keeps `bash -e` from exiting before the tail is printed.
          if ! npm run test:e2e > ../browser-e2e.log 2>&1; then
            echo "::error::browser Golden Journeys failed (see browser-e2e.log)"
            tail -n 80 ../browser-e2e.log
            exit 1
          fi

      - name: Run real-stack browser gates
        if: steps.ci_scope.outputs.frontend_e2e_required == 'true' && steps.playwright_install.outcome == 'success'
        id: real_stack_browser_e2e
        continue-on-error: true
        timeout-minutes: 8
        working-directory: frontend
        run: |
          set -o pipefail
          if ! npm run test:e2e:real-stack > ../real-stack-browser-e2e.log 2>&1; then
            echo "::error::real-stack browser gates failed (see real-stack-browser-e2e.log)"
            tail -n 120 ../real-stack-browser-e2e.log
            exit 1
          fi

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            pytest.log
            rag-quality-baseline.json
            rag-quality-baseline.log
            detect-secrets-report.json
            mypy.log
            frontend.log
            frontend-deps.log
            playwright-install.log
            browser-e2e.log
            real-stack-browser-e2e.log
            frontend/playwright-report
            frontend/playwright-real-stack-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce required CI outcomes
        if: always()
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
          CI_FRONTEND_REQUIRED: ${{ steps.ci_scope.outputs.frontend_required }}
          # Single source of truth: the classifier decides, not the event type. Re-deriving
          # "main push => browser" here is what made enforcement demand browser gates that the
          # classifier had not asked for.
          #
          # The browser tier is keyed to registered frontend interaction surfaces. The
          # research web-fetch tier is reported separately and never gates the Playwright
          # steps: a crawler change used to launch the frontend Golden Journeys purely
          # because its path contained "browser".
          CI_BROWSER_REQUIRED: ${{ steps.ci_scope.outputs.frontend_e2e_required }}
          CI_RESEARCH_BROWSER_REQUIRED: ${{ steps.ci_scope.outputs.research_browser_required }}
        run: python tools/check_ci_outcomes.py
