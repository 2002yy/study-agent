name: RQ1-C Planner Benchmark

on:
  push:
    branches:
      - codex/rq1c-bounded-qualification

permissions:
  contents: read

concurrency:
  group: rq1c-planner-benchmark
  cancel-in-progress: false

jobs:
  planner-benchmark:
    if: "${{ github.event.head_commit.message == 'rq1c-planner-benchmark-local-qwen15b' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      LLAMA_CPP_TAG: b10809
      LLAMA_CPP_ARCHIVE_SHA256: 5e34434ddc6d03cd1584f403201aff0d4bd1a5793a72ff7e286532dfd1e4b941  # pragma: allowlist secret
      HF_MODEL_REPO: Qwen/Qwen2.5-1.5B-Instruct-GGUF
      HF_MODEL_FILE: qwen2.5-1.5b-instruct-q4_k_m.gguf
      MODEL_SHA256_EXPECTED: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  # pragma: allowlist secret
      MODEL_ALIAS: rq1c-qwen25-15b-instruct-q4km

    steps:
      - name: Check out exact benchmark head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Study Agent dependencies
        run: pip install -r requirements.txt

      - name: Install pinned llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-llama output
          archive=.local-llama/llama.tar.gz
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_TAG}/llama-${LLAMA_CPP_TAG}-bin-ubuntu-x64.tar.gz" \
            -o "$archive"
          echo "${LLAMA_CPP_ARCHIVE_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C .local-llama
          server="$(find .local-llama -type f -name llama-server -print -quit)"
          test -n "$server"
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          "$server" --version | tee output/llama-server-version.log

      - name: Download pinned Qwen2.5 1.5B GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local-model output
          model=.local-model/${HF_MODEL_FILE}
          curl -fL --retry 5 --retry-delay 3 \
            "https://huggingface.co/${HF_MODEL_REPO}/resolve/main/${HF_MODEL_FILE}?download=true" \
            -o "$model"
          test -s "$model"
          actual="$(sha256sum "$model" | awk '{print $1}')"
          test "$actual" = "$MODEL_SHA256_EXPECTED"
          echo "MODEL_PATH=$model" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$actual" "$HF_MODEL_FILE" | tee output/model-sha256.txt

      - name: Start local OpenAI-compatible server
        shell: bash
        run: |
          set -euo pipefail
          "$LLAMA_SERVER" \
            -m "$MODEL_PATH" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 \
            --port 8000 \
            -c 8192 \
            -np 1 \
            -t "$(nproc)" \
            --jinja \
            > output/llama-server.log 2>&1 &
          echo $! > output/llama-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health > output/llama-health.json 2>/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat output/llama-server.pid)" 2>/dev/null; then
              cat output/llama-server.log >&2
              exit 1
            fi
            sleep 2
          done
          cat output/llama-server.log >&2
          exit 1

      - name: Benchmark exact production claim-planner runtime
        shell: python
        run: |
          import json
          import subprocess
          import time
          from pathlib import Path
          from openai import OpenAI
          from src.web.research.claim_planner import (
              CLAIM_PLANNER_MAX_TOKENS,
              RuntimeClaimPlanner,
          )
          from src.web.research.contracts import ResearchBudget
          from src.web.research.model_gateway import ResearchModelGateway

          client = OpenAI(
              api_key='local',
              base_url='http://127.0.0.1:8000/v1',
              timeout=20,
              max_retries=0,
          )
          budget = ResearchBudget(
              max_candidates=20,
              max_reads=8,
              soft_timeout_seconds=45,
              hard_timeout_seconds=60,
              max_total_chars=16000,
          )
          questions = [
              (
                  'current_policy',
                  "According to Docker's current official documentation, what pull-rate limits apply to unauthenticated users and authenticated Personal users on Docker Hub?",
              ),
              (
                  'causal_complex',
                  "According to Cloudflare's primary postmortem and independent technical reporting, what directly triggered the June 12, 2025 Cloudflare outage, and what contributing factors made the incident broader or harder to recover from?",
              ),
              (
                  'unverifiable',
                  'Which exact vulnerabilities will be fixed in the next Python security release before the Python Security Response Team publicly announces them?',
              ),
          ]
          records = []
          for index, (question_name, question) in enumerate(questions, start=1):
              planner = RuntimeClaimPlanner(
                  ResearchModelGateway(
                      client=client,
                      model_name='rq1c-qwen25-15b-instruct-q4km',
                      timeout_seconds=20,
                  )
              )
              started = time.monotonic()
              result = planner.plan(
                  run_id=f'planner_benchmark_{index}',
                  question=question,
                  reference_date='2026-09-05',
                  budget=budget,
                  mode='active',
                  timeout_seconds=20,
              )
              elapsed = round(time.monotonic() - started, 6)
              audit = result.audits[0] if result.audits else None
              record = {
                  'question': question_name,
                  'max_tokens': CLAIM_PLANNER_MAX_TOKENS,
                  'timeout_seconds': 20,
                  'elapsed_seconds': elapsed,
                  'completed': result.completed,
                  'reason': result.reason,
                  'audit_count': len(result.audits),
                  'finish_reason': None if audit is None else audit.finish_reason,
                  'prompt_tokens': None if audit is None else audit.input_tokens,
                  'completion_tokens': None if audit is None else audit.output_tokens,
                  'total_tokens': None if audit is None else audit.total_tokens,
                  'claims_count': 0 if result.state is None else len(result.state.claims),
                  'surfaces': [] if result.state is None else [claim.text for claim in result.state.claims],
                  'priorities': [] if result.state is None else [claim.priority for claim in result.state.claims],
              }
              records.append(record)
              print(json.dumps(record, ensure_ascii=False, sort_keys=True))

          summary = {
              'kind': 'non_qualification_claim_planner_benchmark',
              'git_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'model_repo': 'Qwen/Qwen2.5-1.5B-Instruct-GGUF',
              'model_file': 'qwen2.5-1.5b-instruct-q4_k_m.gguf',
              'model_sha256': '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e',  # pragma: allowlist secret
              'records': records,
          }
          Path('output/rq1c-planner-benchmark.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          if not all(
              item['completed']
              and item['audit_count'] == 1
              and item['elapsed_seconds'] < 20.0
              for item in records
          ):
              raise SystemExit('one or more exact production planner requests failed')

      - name: Upload planner benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rq1c-planner-benchmark
          path: |
            output/rq1c-planner-benchmark.json
            output/model-sha256.txt
            output/llama-server-version.log
            output/llama-server.log
            output/llama-health.json
          if-no-files-found: warn
          retention-days: 7
